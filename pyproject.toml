[project]
name = "sds-extract"
version = "0.1.0"
description = "Extract trade name, revision date and hazard statements from Safety Data Sheets with a local LLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=50.0.2",
    "jinja2>=3.1",
    "ollama>=0.6",
    "pydantic>=2.7",
    "pypdf[crypto]>=5.0",
]

[project.optional-dependencies]
# Review UI only. The pipeline itself never imports it.
ui = ["nicegui>=3.0"]

[project.scripts]
sds-extract = "sds_extract.cli:main"

[dependency-groups]
release = ["python-semantic-release>=10.7"]
dev = ["pytest>=8", { include-group = "release" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

# Version comes from Conventional Commits: fix -> patch, feat -> minor, "!" or BREAKING CHANGE -> major.
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
commit_message = "chore(release): v{version}"
# Stay on 0.x while the tool is in development; set major_on_zero = true to cut 1.0.0.
allow_zero_version = true
major_on_zero = false
# Keep uv.lock in sync with the bumped version and build the wheel attached to the GitHub release.
build_command = """
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
    uv build
"""

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
